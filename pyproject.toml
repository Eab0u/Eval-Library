[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eval-lib"
version = "0.1.0"
description = "A lightweight evaluation library wrapping the Braintrust Eval SDK."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "braintrust>=0.0.170",
    "autoevals>=0.0.70",
    "anthropic>=0.25.0",
    "litellm>=1.40.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.hatch.build.targets.wheel]
packages = ["eval_lib"]
